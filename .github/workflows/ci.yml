name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workspace/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build

  python:
    name: Python tests (backend logic, labs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The tested modules are pure Python + NumPy; the inference stack
      # (torch, OpenMMLab, ONNX Runtime) is not needed here.
      - run: pip install pytest "numpy<2.0.0"
      - name: Backend tests
        working-directory: workspace/backend
        run: python -m pytest -q tests
      - name: Labs tests
        run: python -m pytest -q labs/tests
